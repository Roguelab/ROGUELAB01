<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROGUELAB Admin</title><link rel="stylesheet" href="/style.css"></head><body><main class="panel"><a class="logo" href="/">ROGUELAB</a><h1>ADMIN CONTROL</h1><section id="login" class="box"><input id="pw" type="password" placeholder="Admin password"><button onclick="login()">LOGIN</button></section><section id="app" hidden><div class="box"><h2>Add Product</h2><input id="n" placeholder="Name"><input id="price" type="number" placeholder="Price"><input id="stock" type="number" placeholder="Stock"><input id="gsm" placeholder="GSM"><input id="img" placeholder="Image URL"><input id="sizes" placeholder="Sizes: M,L,XL"><button onclick="addProduct()">ADD</button></div><div class="box"><h2>Products</h2><div id="plist"></div></div><div class="box"><h2>Packages / QR</h2><div id="pkgs"></div><button onclick="newPkg()">ADD PACKAGE</button></div><div class="box"><h2>Orders</h2><div id="orders"></div></div></section></main><script>let token='';const H=()=>({Authorization:'Bearer '+token,'Content-Type':'application/json'});async function login(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value})}),j=await r.json();if(j.token){token=j.token;login.hidden=true;app.hidden=false;load()}else alert(j.error)}async function load(){let [a,b,c]=await Promise.all(['/api/admin/products','/api/admin/packages','/api/admin/orders'].map(x=>fetch(x,{headers:H()})));let ps=await a.json(),pk=await b.json(),os=await c.json();plist.innerHTML=ps.map(p=>`<div class="box"><b>${p.name}</b> — $${p.price} — stock ${p.stock} <button onclick="editP('${p.id}',${p.price},${p.stock})">EDIT</button></div>`).join('');pkgs.innerHTML=pk.map(p=>`<div class="box"><b>${p.id}</b> — ${p.product} — ${p.status}<br><a href="/package/${p.id}" target="_blank">PUBLIC PAGE</a> · <a href="/api/package/${p.id}/qr" target="_blank">QR PNG</a> <button onclick="editPkg('${p.id}')">EDIT</button></div>`).join('');orders.innerHTML=os.map(o=>`<div>${o.id} — ${o.customer?.name||''} — $${o.total} — ${o.status}</div>`).join('')}async function addProduct(){await fetch('/api/admin/products',{method:'POST',headers:H(),body:JSON.stringify({name:n.value,price:+price.value,stock:+stock.value,gsm:gsm.value,image:img.value,sizes:sizes.value.split(',').map(x=>x.trim()),currency:'USD',active:true})});load()}async function editP(id,pr,st){let p=prompt('Price',pr),s=prompt('Stock',st);if(p!==null)await fetch('/api/admin/products/'+id,{method:'PUT',headers:H(),body:JSON.stringify({price:+p,stock:+s})});load()}async function newPkg(){let id=prompt('Package ID'),product=prompt('Product'),dest=prompt('Destination');if(!id)return;await fetch('/api/admin/packages',{method:'POST',headers:H(),body:JSON.stringify({id,product,quantity:1,weight:'',value:'',origin:'Sri Lanka',destination:dest,publicAddress:dest,status:'Preparing',trackingNumber:'',estimatedDelivery:''})});load()}async function editPkg(id){let status=prompt('Status','In Transit'),tracking=prompt('Tracking number'),dest=prompt('Public destination');await fetch('/api/admin/packages/'+id,{method:'PUT',headers:H(),body:JSON.stringify({status,trackingNumber:tracking||'',publicAddress:dest||''})});load()}</script></body></html>
