<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROGUELAB Package</title><link rel="stylesheet" href="/style.css"></head><body><main class="package" id="p">Loading...</main><script>let id=location.pathname.split('/').pop();fetch('/api/package/'+encodeURIComponent(id)).then(r=>r.json()).then(x=>p.innerHTML=`<div class="logo">ROGUELAB</div><small>PACKAGE VERIFICATION</small><h1>${x.id}</h1><div class="status">${x.status||'—'}</div><section class="box"><p><b>Product</b><br>${x.product||'—'}</p><p><b>Quantity</b><br>${x.quantity||'—'}</p><p><b>Weight</b><br>${x.weight||'—'}</p><p><b>Declared Value</b><br>${x.value||'—'}</p><p><b>Origin</b><br>${x.origin||'—'}</p><p><b>Destination</b><br>${x.publicAddress||x.destination||'—'}</p><p><b>Tracking</b><br>${x.trackingNumber||'Not assigned'}</p><p><b>Estimated Delivery</b><br>${x.estimatedDelivery||'—'}</p></section><img class="qr" src="/api/package/${encodeURIComponent(x.id)}/qr"></main>`).catch(()=>p.innerHTML='<h1>Package not found</h1>')</script></body></html>
